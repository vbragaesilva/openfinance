[build]
  # Migra o banco do contexto (Turso de produção ou o do preview) depois do build: se o build
  # falhar, nada é migrado; se a migração falhar, o deploy falha e o site antigo continua no ar.
  command = "npm run build && npm run db:migrate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# O service worker e o manifesto precisam ser buscados de novo a cada visita,
# senão uma versão nova do app demora a chegar.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
